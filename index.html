<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Entrena y supera tus límites con Imperium Cross.">
  <title>Imperium Cross | Supera tus límites</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header" id="inicio">
    <div class="site-header__inner">
      <a class="brand" href="#inicio" aria-label="Imperium Cross, inicio">
        <span class="brand__icon" aria-hidden="true">✦</span>
        <span class="brand__name">IMPERIUM</span>
        <span class="brand__tag">CROSS</span>
      </a>
      <nav class="main-nav" aria-label="Navegación principal">
        <a href="#inicio">Inicio</a><a href="#nosotros">Nosotros</a><a href="#planes">Planes</a>
        <a href="#entrenadores">Entrenadores</a><a href="#testimonios">Testimonios</a>
      </nav>
      <a class="contact-button" href="#contacto">Contáctanos</a>
    </div>
  </header>
  <main>
    <section class="hero">
      <img class="hero__image" src="imperium-team.jpg" alt="Comunidad de Imperium Cross reunida en el gimnasio">
      <div class="hero__shade"></div>
      <div class="hero__content">
        <h1>Transforma tu rutina,<br>supera tus límites</h1>
        <p>Entrena, diviértete y mejora</p>
        <div class="hero__actions">
          <a class="hero-button hero-button--primary" href="#planes">Ver planes</a>
          <a class="hero-button hero-button--outline" href="#nosotros">Conócenos</a>
        </div>
      </div>
    </section>
    <section class="intro" id="nosotros">
      <p>Fuerza · Comunidad · Disciplina</p>
      <h2>Tu mejor versión empieza aquí.</h2>
    </section>
    <div id="planes"></div><div id="entrenadores"></div><div id="testimonios"></div><div id="contacto"></div>
  </main>
</body>
</html>
